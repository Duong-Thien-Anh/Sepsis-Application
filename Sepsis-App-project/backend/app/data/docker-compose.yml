version: "3.8"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver-sepsis
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
      - ./APP_SepsisManagement.sql:/docker-entrypoint-initdb.d/APP_SepsisManagement.sql

  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - db
    volumes:
      - ./APP_SepsisManagement.sql:/sql/APP_SepsisManagement.sql
    entrypoint: /bin/bash
    command: -c "sleep 20; /opt/mssql-tools/bin/sqlcmd -S db -U SA -P $${SA_PASSWORD} -i /sql/APP_SepsisManagement.sql"
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"

volumes:
  mssqldata:
